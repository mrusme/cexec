name: Release

on:
  push:
    tags:
      - '*'

jobs:

  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4

    - name: Set up Zig
      uses: mlugg/setup-zig@v2
      with:
        version: 0.16.0

    - name: Run tests
      run: zig build test --summary all

    - name: Cross compile
      run: zig build release

    - name: Package
      run: |
        mkdir -p dist
        for target in zig-out/release/*; do
          name=$(basename "$target")
          tar -czf "dist/cexec-${GITHUB_REF_NAME}-${name}.tar.gz" \
            --exclude='*.pdb' \
            -C "$target" . \
            -C "$GITHUB_WORKSPACE" LICENSE README.md
        done
        cd dist && sha256sum *.tar.gz > checksums.txt

    - name: Publish
      uses: softprops/action-gh-release@v2
      with:
        files: dist/*
